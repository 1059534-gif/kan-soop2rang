<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comic | KAN / Soop2rang Official Links</title>
  <meta name="description" content="KAN과 숲이랑(Soop2rang)의 만화 연재 링크, SNS, 연락처를 모아 보여주는 작가 허브 사이트">
  <style>
    @font-face {
      font-family: "Gowun Dodum";
      src: url("assets/fonts/GowunDodum-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #66615d;
      --line: #ded8d0;
      --paper: #fffaf1;
      --panel: #ffffff;
      --red: #d94a3a;
      --teal: #0f9189;
      --blue: #3157a4;
      --gold: #d99d24;
      --shadow: 0 20px 55px rgba(38, 31, 25, .13);
      font-family: "Gowun Dodum", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(90deg, rgba(23, 23, 23, .045) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(rgba(23, 23, 23, .035) 1px, transparent 1px) 0 0 / 36px 36px,
        var(--paper);
      color: var(--ink);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px clamp(18px, 4vw, 56px);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 250, 241, .9);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 160px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--red);
      color: #fff;
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 19px;
      line-height: 1;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav a,
    .link-button,
    .filter-button {
      min-height: 40px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      background: #fff;
      box-shadow: 2px 2px 0 var(--ink);
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      font-size: 14px;
    }

    .nav a:hover,
    .link-button:hover,
    .filter-button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
      background: #fff2cf;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
      gap: clamp(26px, 5vw, 70px);
      align-items: center;
      min-height: calc(100vh - 72px);
      padding: clamp(32px, 6vw, 74px) clamp(18px, 4vw, 56px) 42px;
    }

    .hero h1 {
      max-width: 850px;
      margin: 0;
      font-size: clamp(42px, 8vw, 96px);
      line-height: .98;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 680px;
      margin: 22px 0 0;
      color: #3a3631;
      font-size: clamp(17px, 2.1vw, 22px);
      line-height: 1.65;
      word-break: keep-all;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .hero-art {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      min-height: min(62vh, 600px);
    }

    .comic-panel {
      position: relative;
      overflow: hidden;
      min-height: 190px;
      border: 3px solid var(--ink);
      border-radius: 6px;
      background: #fff;
      box-shadow: 7px 7px 0 var(--ink);
    }

    .comic-panel::before,
    .comic-panel::after {
      position: absolute;
      content: "";
      inset: auto;
      border: 3px solid var(--ink);
    }

    .panel-one {
      background:
        radial-gradient(circle at 74% 24%, #fff 0 9%, transparent 10%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.42) 0 8px, transparent 8px 18px),
        #f36b53;
    }

    .panel-one::before {
      width: 56%;
      height: 42%;
      left: 13%;
      bottom: 16%;
      border-radius: 50% 50% 44% 40%;
      background: #fff7db;
      transform: rotate(-10deg);
    }

    .panel-one::after {
      width: 70px;
      height: 70px;
      right: 18%;
      bottom: 20%;
      border-radius: 50%;
      background: var(--gold);
    }

    .panel-two {
      background:
        linear-gradient(135deg, transparent 0 46%, rgba(255,255,255,.52) 47% 51%, transparent 52%),
        #38a6a0;
    }

    .panel-two::before {
      width: 115px;
      height: 115px;
      right: 13%;
      top: 17%;
      border-radius: 6px;
      background: #fff;
      transform: rotate(12deg);
    }

    .panel-two::after {
      width: 48%;
      height: 14px;
      left: 13%;
      bottom: 20%;
      border-width: 2px;
      border-radius: 999px;
      background: var(--ink);
      box-shadow: 0 -28px 0 var(--ink), 0 -56px 0 var(--ink);
    }

    .panel-three {
      background:
        radial-gradient(circle at 50% 50%, #fff 0 4px, transparent 5px) 0 0 / 25px 25px,
        #f2c45a;
    }

    .panel-three::before {
      width: 130px;
      height: 88px;
      left: 14%;
      top: 20%;
      border-radius: 50%;
      background: #fff;
    }

    .panel-three::after {
      width: 42%;
      height: 42%;
      right: 10%;
      bottom: 8%;
      border-radius: 6px;
      background: #2f58a7;
      transform: rotate(-8deg);
    }

    .panel-four {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px),
        #394b75;
    }

    .panel-four::before {
      width: 65%;
      height: 70%;
      left: 18%;
      top: 15%;
      border-radius: 6px 6px 50% 50%;
      background: #fff9e8;
    }

    .panel-four::after {
      width: 34%;
      height: 18%;
      right: 11%;
      top: 18%;
      border-radius: 50%;
      background: #ef5a4a;
    }

    .section {
      padding: 70px clamp(18px, 4vw, 56px);
      border-top: 1px solid var(--line);
    }

    .section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .section h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0;
    }

    .section-note {
      max-width: 520px;
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      word-break: keep-all;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 26px;
    }

    .filter-button {
      padding: 0 14px;
    }

    .filter-button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
      box-shadow: 2px 2px 0 var(--red);
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .work-card,
    .alias-card,
    .contact-strip {
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .work-card {
      overflow: hidden;
      display: grid;
      grid-template-rows: 230px auto;
      min-width: 0;
    }

    .cover {
      position: relative;
      display: grid;
      align-items: center;
      justify-items: center;
      min-height: 230px;
      padding: 16px;
      border-bottom: 2px solid var(--ink);
      background: var(--cover-bg);
      color: #fff;
      isolation: isolate;
    }

    .cover::before {
      position: absolute;
      content: "";
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 14% 20%, rgba(255,255,255,.65) 0 7%, transparent 8%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.18) 0 8px, transparent 8px 19px);
    }

    .cover strong {
      width: min-content;
      min-width: 62%;
      padding: 8px 10px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: #fffaf1;
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 24px;
      line-height: 1.12;
      word-break: keep-all;
    }

    .cover-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
    }

    .work-title {
      margin: 0;
      color: var(--accent);
      font-family: "Gowun Dodum", sans-serif;
      font-size: clamp(32px, 4vw, 52px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .work-body {
      display: grid;
      gap: 14px;
      padding: 18px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .work-body p {
      min-height: 76px;
      margin: 0;
      color: #393530;
      line-height: 1.55;
      word-break: keep-all;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .link-button svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.4;
      flex: 0 0 auto;
    }

    .link-button[aria-disabled="true"] {
      opacity: .55;
      cursor: not-allowed;
      pointer-events: none;
    }

    .reader-panel {
      margin-top: 24px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: #fff;
      box-shadow: 8px 8px 0 var(--teal);
      overflow: hidden;
    }

    .reader-panel[hidden] {
      display: none;
    }

    .reader-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      padding: 20px;
      border-bottom: 2px solid var(--ink);
      background: #fff2cf;
    }

    .reader-head h3 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: 0;
    }

    .reader-head p {
      margin: 6px 0 0;
      color: #4a433c;
      line-height: 1.55;
      word-break: keep-all;
    }

    .reader-close {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 6px;
      background: #fff;
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .reader-links {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 18px;
    }

    .region-link {
      display: grid;
      gap: 5px;
      min-height: 92px;
      padding: 14px;
      border: 1px solid var(--ink);
      border-radius: 7px;
      background: #fff;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .region-link:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
      background: #f7fff9;
    }

    .region-link strong {
      font-size: 16px;
      line-height: 1.3;
      word-break: keep-all;
    }

    .region-link span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
      word-break: keep-all;
    }

    .aliases-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .alias-card {
      display: grid;
      gap: 14px;
      padding: 20px;
    }

    .alias-head {
      display: block;
    }

    .alias-card h3 {
      margin: 0;
      font-size: 23px;
    }

    .alias-card p {
      margin: 3px 0 0;
      color: var(--muted);
      line-height: 1.5;
      word-break: keep-all;
    }

    .contact-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: start;
      padding: clamp(22px, 4vw, 34px);
      background: #171717;
      color: #fff;
      box-shadow: 8px 8px 0 var(--red);
    }

    .contact-strip h2 {
      color: #fff;
    }

    .contact-strip p {
      max-width: 1120px;
      margin: 8px 0 0;
      color: #eee4d7;
      line-height: 1.55;
      word-break: keep-all;
    }

    .contact-strip .link-button {
      width: fit-content;
      margin-top: 16px;
      border-color: #fff;
      background: #fff;
      box-shadow: 3px 3px 0 var(--gold);
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .social-button {
      display: inline-grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 6px;
      background: #fff;
      box-shadow: 2px 2px 0 var(--ink);
      color: var(--ink);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .social-button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
      background: #fff2cf;
    }

    .social-button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-button .filled {
      fill: currentColor;
      stroke: none;
    }

    .empty {
      display: none;
      padding: 22px;
      border: 2px dashed var(--muted);
      border-radius: 8px;
      background: rgba(255,255,255,.55);
      color: var(--muted);
      font-weight: 800;
    }

    .footer {
      padding: 26px clamp(18px, 4vw, 56px) 42px;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .hero,
      .contact-strip {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: auto;
      }

      .hero-art {
        min-height: 520px;
      }

      .works-grid,
      .aliases-grid,
      .reader-links {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .section-header {
        align-items: start;
        flex-direction: column;
      }
    }

    @media (max-width: 660px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav {
        justify-content: flex-start;
      }

      .hero-art {
        grid-template-columns: 1fr 1fr;
        min-height: 420px;
        gap: 10px;
      }

      .comic-panel {
        min-height: 160px;
        box-shadow: 4px 4px 0 var(--ink);
      }

      .works-grid,
      .aliases-grid,
      .reader-links {
        grid-template-columns: 1fr;
      }

      .reader-head {
        grid-template-columns: 1fr;
      }

      .work-card {
        grid-template-rows: 210px auto;
      }

      .cover {
        min-height: 210px;
      }

      .links,
      .hero-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .link-button {
        width: 100%;
      }
    }

    /* Drive Capital style reference adaptation */
    :root {
      --ink: #000000;
      --muted: #000000;
      --line: #e2e8f0;
      --paper: #fff8f1;
      --panel: #fff8f1;
      --red: #006eff;
      --teal: #006eff;
      --blue: #006eff;
      --gold: #006eff;
      --shadow: none;
      --accent: #006eff;
      font-family: "Gowun Dodum", sans-serif;
    }

      background: var(--paper);
      color: var(--ink);
      font-weight: 300;
      letter-spacing: 0;
      font-feature-settings: "clig", "liga";
    }

    .topbar {
      position: sticky;
      padding: 22px clamp(24px, 7.5vw, 144px);
      border-top: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      background: rgba(255, 248, 241, .96);
      backdrop-filter: blur(10px);
    }

    .brand {
      gap: 14px;
      min-width: auto;
      color: var(--accent);
      font-size: 16px;
      font-weight: 300;
      text-transform: uppercase;
    }

      box-shadow: none;
      color: var(--accent);
      font-size: 17px;
    }

    }

    .nav a,
    .filter-button,
    .link-button {
      min-height: 48px;

      border-radius: 60px;
      background: transparent;
      box-shadow: none;
      color: var(--accent);
      font-size: 16px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .nav a {
      min-height: auto;
      padding: 0;
      border: 0;

      color: var(--accent);
    }

    .nav a:hover,
    .filter-button:hover,
    .link-button:hover,
    .social-button:hover,
    .region-link:hover,
    .reader-close:hover {
      transform: none;
      box-shadow: none;
      background: transparent;
      color: var(--ink);
      border-color: var(--ink);
    }

    .hero {

      text-align: center;
    }

    .hero h1 {
      max-width: 1200px;
      margin: 0 auto;
      color: var(--accent);
      font-family: "Gowun Dodum", sans-serif;
      font-size: clamp(64px, 12vw, 120px);
      font-weight: 300;
      line-height: .95;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 600px;
      margin: 29px auto 0;
      color: var(--ink);
      font-size: 21px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
    }

    .hero-actions {
      justify-content: center;
      gap: 20px;
      margin-top: 43px;
    }

    .hero-actions .link-button,
    .work-body .link-button,
    .contact-strip .link-button {
      padding: 14px 43px;
    }

    .hero-art {
      display: none;
    }

    .section {
      padding: clamp(96px, 12vw, 150px) clamp(24px, 7.5vw, 144px);
      border-top: 0;
      border-bottom: 1.5px solid var(--line);
    }

    .section-header {
      display: grid;
      justify-items: center;
      gap: 29px;
      margin-bottom: 43px;
      text-align: center;
    }

    .section h2,
    .contact-strip h2 {
      color: var(--accent);
      font-family: "Gowun Dodum", sans-serif;
      font-size: clamp(56px, 8vw, 77px);
      font-weight: 300;
      line-height: .95;
      letter-spacing: 0;
    }

    .section-note,
    .contact-strip p,
    .work-body p,
    .alias-card p,
    .reader-head p,
    .region-link span {
      color: var(--ink);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
    }

    .section-note,
    .contact-strip p {
      max-width: 600px;
    }

    .filters {
      justify-content: center;
      gap: 11px;
      margin-bottom: 43px;
    }

    .filter-button {
      padding: 0 30px;
    }

    .filter-button[aria-pressed="true"] {
      background: transparent;
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: none;
    }

    .works-grid,
    .aliases-grid {
      grid-template-columns: 1fr;
      max-width: 1200px;
      margin: 0 auto;
      gap: 20px;
    }

    .work-card,
    .alias-card,
    .contact-strip,
    .reader-panel {
      border: 1.5px solid var(--line);
      border-radius: 0;
      background: var(--paper);
      box-shadow: none;
    }

    .work-card {
      grid-template-columns: minmax(220px, 34%) minmax(0, 1fr);
      grid-template-rows: auto;
      min-height: 260px;
    }

    .cover {
      min-height: 260px;
      padding: 14px;
      border-right: 1.5px solid var(--line);
      border-bottom: 0;
      background: var(--paper) !important;
      color: var(--accent);
    }

    .cover::before,
    .cover::after {
      display: none;
    }

    .cover strong {
      display: none;
      width: auto;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--accent);

      "웹툰프렌즈": "Naver Webtoon Friends",
      "동만만화": "Dongman Manhua",
      "야후": "ebookjapan",
      "봄툰": "Bomtoon",
      "레진": "Lezhin"
    };

    let currentLang = localStorage.getItem("siteLang") || "ko";

    const translations = {
      ko: {
        back: "← 돌아가기",
        readLinks: "공식 연재 링크",
        merchLinks: "공식 굿즈",
        goodsSoon: "굿즈 준비중",
        langToggle: "English"
      },
      en: {
        back: "← Back",
        readLinks: "Read Officially Worldwide",
        merchLinks: "Official Goods",
        goodsSoon: "Goods Soon",
        langToggle: "한국어"
      }
    };

    const localizedWorks = {
      "my-first-love": { en: "#MyFirstLove" },
      "red-thread-quest": { en: "Red Thread Quest" },
      "love-derailed": { en: "Love Derailed" },
      "emperor-hunt": { en: "Emperor Hunt" },
      "summer-nights-dream": { en: "A Summer Night's Dream" },
      "black-haired-beasts-love": { en: "Black-haired Beast's Love" }
    };

    const localizedDescriptions = {
      "my-first-love": { en: "Isol Yeon, the school’s top student and biggest outcast, gains the ability to see people’s true feelings about her through the Hashtag Lens, which she acquires after making the ten‑quintillionth wish. Through the lens, she discovers that Shinu Seong, her former middle‑school best friend she had a painful fallout with, has tagged her as “#my_first_love_and_trash.” Can Isol mend their broken relationship and overcome the pain of being betrayed by her first love?" },
      "red-thread-quest": { en: "As a first-year law student, Lee Yeon never expected to cross paths again with his middle school crush — the charming upperclassman Hong Kihoon. But a chance reunion on campus leads to an even more unexpected twist: a spontaneous trip, and a strange challenge known only as the Red Thread Quest. Red Thread Quest, Round 1: Five Kisses on the Cheek! Skeptical about soulmates and fate, Yeon finds himself drawn into the legend of the Red Thread of Fate — and as each round of the quest unfolds, his relationship with Kihoon begins to take an unpredictable turn. What started as a game might just lead them to something real…if the Red Thread Rock has anything to say about it." },
      "love-derailed": { en: "For years, basketball player Lee Ahn has kept his feelings for his older friend Geonu locked away. But when he hears the sudden news of Geonu’s divorce, his heart starts racing all over again. When Geonu reaches out to ask him to model for his company, Lee Ahn knows he has to take his shot.  “I'm too horny to focus on basketball... Could you help me out?”" },
      "emperor-hunt": { en: "Earth is destroyed, and the sole survivor is the immortal being Seul Yun. After losing the only person she ever cared about, she is set out to seek revenge on the one behind it all – the emperor Horson. However, Seul finds herself lost in a strange world called Hetra. There, she must learn to harness her new abilities and fight against a new type of evil. Will Seul be able to hunt down the emperor and carry out her revenge?" },
      "summer-nights-dream": { en: "Have you ever wondered if the person you like is dreaming about you? Teacher Yeoreum Han doesn’t have to guess -- she can make it happen, with her ability to walk into other people’s dreams. She can even link the dreams of two people together, and use this ability to play Cupid for her students. But her matchmaking goes awry when she enters the dream of Si-u Park -- a lucid dreamer, who realizes that Yeoreum is walking into his dream. Si-u and Yeoreum’s lives become intertwined after this incident, weaving a tangled web of love, friendship, and dreamers at Hanseo High." },
      "black-haired-beasts-love": { en: "San once found comfort in Heemin’s kindness. Years later, he confesses the love he has kept hidden, not to win Heemin over but to finally walk away with closure. To his surprise, Heemin accepts his feelings without hesitation. Struggling to trust something that feels too easy, San finds himself torn between doubt and longing. He yearns for a kind of love he has never learned how to receive. A tender and tangled love begins between a black-haired beast still learning how to be human, and the man who never turned him away." }
    };

    const localizedAliases = {
      "KAN": { en: "KAN" },
      "숲이랑": { en: "Soop2rang" },
      "숲이랑 & MUJ0": { en: "Soop2rang & MUJ0" }
    };

    const statusNames = {
      "연재중": { en: "Ongoing" },
      "완결": { en: "Completed" }
    };

    const formatNames = {
      "장편": { en: "Long-form" },
      "단편": { en: "Short-form" }
    };

    function text(key) {
      return translations[currentLang][key];
    }

    function setLanguage(lang, options = {}) {
      currentLang = lang;
      localStorage.setItem("siteLang", lang);
      document.documentElement.lang = lang === "ko" ? "ko" : "en";
      const toggle = document.querySelector("[data-lang-toggle]");
      if (toggle) toggle.textContent = translations[lang].langToggle;
      renderComicDetail();
      if (!options.silent) window.dispatchEvent(new CustomEvent("site-language-change"));
    }

    function workTitle(work) {
      return currentLang === "en" ? (localizedWorks[work.id]?.en || work.title) : work.title;
    }

    function workDescription(work) {
      return currentLang === "en" ? (localizedDescriptions[work.id]?.en || work.description) : work.description;
    }

    function aliasText(alias) {
      return currentLang === "en" ? (localizedAliases[alias]?.en || alias) : alias;
    }

    function statusText(status) {
      return currentLang === "en" ? (statusNames[status]?.en || status) : status;
    }

    function formatText(work) {
      const format = work.categories.find((category) => category === "장편" || category === "단편") || "장편";
      return currentLang === "en" ? (formatNames[format]?.en || format) : format;
    }

    function workPlatformText(work) {
      if (currentLang !== "en") return work.platform;
      return work.platform.split(" / ").map((item) => platformNames[item] || item).join(" / ");
    }

    function webtoonRegion(link) {
      const url = link?.url || "";
      if (url.includes("/en/")) return "US";
      if (url.includes("/fr/")) return "FR";
      if (url.includes("/es/")) return "ES";
      if (url.includes("/de/")) return "DE";
      if (url.includes("/id/")) return "ID";
      if (url.includes("/th/")) return "TH";
      if (url.includes("/zh-hant/")) return "TW";
      return "";
    }

    function platformText(platform, link) {
      if (platform === "WEBTOON") {
        const region = webtoonRegion(link);
        return region ? `WEBTOON ${region}` : "WEBTOON";
      }
      return platformNames[platform] || platform;
    }

    function displayLinkTitle(link, work) {
      return link.label;
    }

    const platformLogos = {
      "네이버웹툰": "assets/logos/naver-webtoon.png",
      "네이버웹툰프렌즈": "assets/logos/naver-webtoon-friends.png",
      "WEBTOON": "assets/logos/webtoon.png",
      "동만만화": "assets/logos/dongmanmanhua.png",
      "야후": "assets/logos/ebookjapan.png",
      "LINE Manga": "assets/logos/line-manga.png",
      "봄툰": "assets/logos/bomtoon.png",
      "Boomtoon": "assets/logos/bomtoon.png",
      "레진": "assets/logos/lezhin.png",
      "Beltoon": "assets/logos/beltoon.png",
      "J-MEE Shop": "assets/logos/j-mee-shop.png",
      "J-MEE Shop EN": "assets/logos/j-mee-shop.png"
    };

    function platformLogoSrc(platform) {
      if (platformLogos[platform]) return platformLogos[platform];
      if (platform.startsWith("Lezhin")) return platformLogos["레진"];
      if (platform.startsWith("Bomtoon")) return platformLogos["봄툰"];
      return "";
    }

    function platformLogoLabel(platform) {
      if (platform === "WEBTOON" || platform === "네이버웹툰") return "WEB";
      if (platform === "동만만화") return "DM";
      if (platform === "야후") return "e";
      if (platform.includes("라인")) return "LINE";
      if (platform.includes("Lezhin") || platform === "레진") return "L";
      if (platform.includes("Bomtoon") || platform === "봄툰") return "B";
      if (platform.includes("Beltoon")) return "BT";
      if (platform.includes("J-MEE")) return "J";
      return platform.slice(0, 2).toUpperCase();
    }

    function platformLogoSlot(link) {
      const src = platformLogoSrc(link.platform);
      const fallback = platformLogoLabel(link.platform);
      return `<span class="platform-logo-slot" aria-hidden="true">${src ? `<img src="${src}" alt="">` : fallback}</span>`;
    }

    document.addEventListener("click", (event) => {
      const langButton = event.target.closest("[data-lang-toggle]");
      if (langButton) setLanguage(currentLang === "ko" ? "en" : "ko");
    });

    window.addEventListener("site-language-change", () => {
      const next = localStorage.getItem("siteLang") || currentLang;
      if (next !== currentLang) setLanguage(next, { silent: true });
    });

    function renderComicDetail() {
      const params = new URLSearchParams(window.location.search);
      const workId = params.get("work") || works[0].id;
      const work = works.find((item) => item.id === workId) || works[0];
      const worksSection = document.querySelector("#works");

      document.title = `${workTitle(work)} | KAN / Soop2rang Official Links`;
      worksSection.innerHTML = `
        <div class="comic-detail">
          <a class="back-link" href="index.html">${text("back")}</a>
          <div class="comic-hero">
            <img class="comic-banner" src="${work.banner}" alt="${workTitle(work)} 배너">
            <div class="comic-info">
              <p class="section-kicker">${aliasText(work.alias)} · ${statusText(work.status)} · ${formatText(work)}</p>
              <h1 class="comic-title">${workTitle(work)}</h1>
              <p>${workDescription(work)}</p>
            </div>
          </div>
          <div class="section-header comic-links-header">
            <h2>${text("readLinks")}</h2>
          </div>
          <div class="reader-links comic-links">
            ${work.readLinks.map((link) => `
              <a class="region-link" href="${link.url}" target="_blank" rel="noreferrer">
                ${platformLogoSlot(link)}
                <span class="region-link-text">
                  <strong>${displayLinkTitle(link, work)}</strong>
                  <span>${platformText(link.platform, link)}</span>
                </span>
              </a>
            `).join("")}
          </div>
          <div class="section-header comic-links-header comic-merch-header">
            <h2>${text("merchLinks")}</h2>
          </div>
          <div class="reader-links comic-links comic-merch-links">
            ${work.merchLinks.length
              ? work.merchLinks.map((link) => `
                <a class="region-link" href="${link.url}" target="_blank" rel="noreferrer">
                  ${platformLogoSlot(link)}
                  <span class="region-link-text">
                    <strong>${displayLinkTitle(link, work)}</strong>
                    <span>${platformText(link.platform, link)}</span>
                  </span>
                </a>
              `).join("")
              : `<span class="region-link region-link-disabled" aria-disabled="true">
                <span class="platform-logo-slot" aria-hidden="true">...</span>
                <span class="region-link-text">
                  <strong>${text("goodsSoon")}</strong>
                  <span>${workTitle(work)}</span>
                </span>
              </span>`}
          </div>
        </div>
      `;
      requestAnimationFrame(fitComicTitle);
    }

    function fitComicTitle() {
      const title = document.querySelector(".comic-title");
      if (!title) return;

      title.style.fontSize = "";
      const available = title.parentElement.clientWidth;
      const required = title.scrollWidth;
      if (required <= available) return;

      const currentSize = parseFloat(window.getComputedStyle(title).fontSize);
      const nextSize = Math.max(14, currentSize * (available / required));
      title.style.fontSize = `${nextSize}px`;
    }

    window.addEventListener("resize", fitComicTitle);
    if (document.fonts) document.fonts.ready.then(fitComicTitle);

    renderComicDetail();
    setLanguage(currentLang);
  </script>
</body>
</html>
